name: zapcut
description: "A simple on-device video trimming app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  video_player: ^2.10.1
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
   sdk: flutter
  flutter_lints: ^5.0.0
flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
    image_path: "ic_launcher.png"
